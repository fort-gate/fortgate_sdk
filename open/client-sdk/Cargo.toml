[package]
name = "fortgate-id-core"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
x509-parser = "0.16.0"
asn1-rs = "0.6.1"
num-bigint = { version = "0.4.4", features = ["serde"] }
thiserror = "1.0.56"
anyhow = "1.0.79"
hex = "0.4.3"
light-poseidon = "0.2.0"
rand = "0.8.5"
ark-bn254 = "0.4.0"
ark-ff = "0.4.2"
ark-serialize = "0.4.2"
sha2 = "0.10.8"
serde = { version = "1.0", features = ["derive"] }
wasm-bindgen = "0.2.92"
uniffi = { version = "0.28", features = ["cli"] }
serde-wasm-bindgen = "0.6.5"
js-sys = "0.3.69"

[lib]
name = "fortgate_id"
crate-type = ["cdylib", "staticlib", "rlib"]

[dev-dependencies]
x509-parser = "0.16.0"

[build-dependencies]
uniffi_build = "0.28"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
