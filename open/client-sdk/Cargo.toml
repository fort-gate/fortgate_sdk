[package]
name = "fortgate-id-core"
version = "1.0.0"
edition = "2021"

[dependencies]
x509-parser = "0.16.0"
asn1-rs = "0.6.1"
num-bigint = "0.4.4"
thiserror = "1.0.56"
anyhow = "1.0.79"
hex = "0.4.3"
light-poseidon = "0.2.0"
rand = "0.8.5"
ark-bn254 = "0.4.0"
ark-ff = "0.4.2"
serde = { version = "1.0", features = ["derive"] }
wasm-bindgen = "0.2.92"
uniffi = { version = "0.28", features = ["cli"] }

[lib]
name = "fortgate_id"
crate-type = ["cdylib", "staticlib", "rlib"]
