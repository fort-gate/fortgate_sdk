[package]
name = "fortgate-id-script"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[build-dependencies]
sp1-build = "1.2.0"

[dependencies]
fortgate-id-core = { path = "../.." }
fortgate-sp1-shared = { path = "../sp1-shared" }
sp1-sdk = "1.2.0"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
