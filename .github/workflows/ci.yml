name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Test fortgate-id-core
        run: cd open/client-sdk && cargo test
      - name: Clippy
        run: cd open/client-sdk && cargo clippy -- -D warnings

  sp1-guest-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Check SP1 guest crate
        run: cd open/client-sdk/sp1-prover && cargo check -p fortgate-id-program
      - name: Check SP1 host script (ELF placeholder, sin toolchain succinct)
        env:
          SP1_SKIP_PROGRAM_BUILD: "true"
        run: cd open/client-sdk/sp1-prover && cargo check -p fortgate-id-script

  sdk-ts-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build WASM and smoke test
        run: cd sdk-ts && npm install && npm run build:wasm && npm test

  # Pin de Noir para TODOS los jobs Noir: 0.32.0.
  # Es la versión mínima que exige `noir_rsa` v0.1 (`compiler_version = ">=0.32.0"`),
  # la dependencia RSA de `open/proto`. Ver `open/proto/README.md`.
  # Cada job instala su propia toolchain: los jobs no comparten runner ni PATH.
  noir-poseidon-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Noir 0.32.0 (noirup)
        run: |
          curl -L https://raw.githubusercontent.com/noir-lang/noirup/main/install | bash
          echo "$HOME/.nargo/bin" >> "$GITHUB_PATH"
      - name: nargo test (proto-poseidon-check)
        run: |
          export PATH="$HOME/.nargo/bin:$PATH"
          noirup --version 0.32.0
          cd open/proto-poseidon-check && nargo test

  noir-proto-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Noir 0.32.0 (noirup)
        run: |
          curl -L https://raw.githubusercontent.com/noir-lang/noirup/main/install | bash
          echo "$HOME/.nargo/bin" >> "$GITHUB_PATH"
      - name: nargo check (open/proto)
        run: |
          export PATH="$HOME/.nargo/bin:$PATH"
          noirup --version 0.32.0
          cd open/proto && nargo check

  uniffi-bindgen-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Generate Kotlin/Swift stubs if uniffi-bindgen is preinstalled
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          if command -v uniffi-bindgen >/dev/null 2>&1; then
            bash scripts/generate_uniffi_bindings.sh
          else
            echo "uniffi-bindgen not in PATH; install with: cargo install uniffi_bindgen --version 0.28.3 --locked"
            exit 0
          fi
